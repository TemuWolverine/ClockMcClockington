# ESPHome "Take Control" does not like yaml frontmatter.
# author: Paul Jenkins
# name: ClockMcClockington
# version: 0.1
# source: https://github.com/TemuWolverine/ClockMcClockington
# labels: [clock, led matrix, esp32]
# ---

substitutions:
  friendly_name: ClockMcClockington
  device_name: clockmcclockington
  weatherSensor : sensor.clock_temp

  #Sound pins (I2S)
  speaker_i2s_lrclk_pin: GPIO45 #WS
  speaker_i2s_bclk_pin: GPIO42 #SCK
  speaker_i2s_dout_pin : GPIO41 #DIN

  mic_i2s_ws_pin: GPIO7 #lrclk
  mic_i2s_sck_pin: GPIO6 #bclk
  mic_i2s_din_pin : GPIO8  #SD

  #Display pins (I2C)
  mosiPin : GPIO39
  csPin : GPIO40
  clkPin :  GPIO21

  #light sensor pin
  ldr_pin: GPIO15
  
  #button pins
  button_one: GPIO13
  button_two: GPIO12
  button_three: GPIO11
  button_four: GPIO10

  mediaplayer: "speakerguy"
  i2s_microphone: "i2s_microphone"

packages:
  esphome_templates:
    url: https://github.com/TemuWolverine/esphome_templates
    ref: main
    refresh: 1s
    files:
      - boards/esp32_s3_nano.yaml
      - devices/i2s/INMP441.yaml
      - devices/i2s/MAX98357.yaml
      - devices/display/max7219.yaml

  clockmcclockington:
    url: https://github.com/TemuWolverine/ClockMcClockington
    ref: main
    files:
      - shared.yaml
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true


esp32:
  variant: ESP32S3
  framework:
    type: esp-idf

psram:
  mode: octal

# To be able to get logs from the device via serial and api.
logger:

# API is a requirement of the dashboard import.
api:

# OTA is required for Over-the-Air updating
ota:
  - platform: esphome

wifi:
  # Set up a wifi access point using the device name above
  ap:

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device.
captive_portal:

web_server:
  version: 3
  
#global config
globals:
  - id: startup_complete
    type: bool
    initial_value: 'false'

  - id: brightness_dark_cfg
    type: int
    restore_value: yes
    initial_value: '0'

  - id: brightness_dim_cfg
    type: int
    restore_value: yes
    initial_value: '5'

  - id: brightness_mid_cfg
    type: int
    restore_value: yes
    initial_value: '10'

  - id: brightness_bright_cfg
    type: int
    restore_value: yes
    initial_value: '15'

number:
  - platform: template
    name: "1. Dark"
    id: ldr_brightness_dark
    min_value: 0
    max_value: 15
    lambda: 'return (float) id(brightness_dark_cfg);'
    step: 1
    set_action:
      - globals.set:
          id: brightness_dark_cfg
          value: !lambda 'return (int) x;'

  - platform: template
    name: "2. Dim"
    id: ldr_brightness_dim
    min_value: 0
    max_value: 15
    step: 1
    lambda: 'return (float) id(brightness_dim_cfg);'
    set_action:
      - globals.set:
          id: brightness_dim_cfg
          value: !lambda 'return (int) x;'

  - platform: template
    name: "3. Mid"
    id: ldr_brightness_mid
    min_value: 0
    max_value: 15
    step: 1
    lambda: 'return (float) id(brightness_mid_cfg);'
    set_action:
      - globals.set:
          id: brightness_mid_cfg
          value: !lambda 'return (int) x;'

  - platform: template
    name: "4. Bright"
    id: ldr_brightness_bright
    min_value: 0
    max_value: 15
    step: 1
    lambda: 'return (float) id(brightness_bright_cfg);'
    set_action:
      - globals.set:
          id: brightness_bright_cfg
          value: !lambda 'return (int) x;'


binary_sensor:
  - platform: gpio
    pin:
      number: ${button_one}
      mode:
        input: true
        pullup: true
    id: btnOne
    internal: True
    name: "Clock Button One"
    on_press:
      then:
        - homeassistant.event:
            event: esphome.${device_name}.clock_button_pressed
            data: { button: "one", type: "single" }

  - platform: gpio
    pin:
      number: ${button_two}
      mode:
        input: true
        pullup: true
    id: btnTwo
    internal: True
    name: "Clock Button Two"
    on_press:
      then:
        - homeassistant.event:
            event: esphome.${device_name}.clock_button_pressed
            data: { button: "two", type: "single" }

  - platform: gpio
    pin:
      number: ${button_three}
      mode:
        input: true
        pullup: true
    id: btnThree
    name: "Clock Button Three"
    internal: True
    on_press:
      then:
        - homeassistant.event:
            event: esphome.${device_name}.clock_button_pressed
            data: { button: "three", type: "single" }

  - platform: gpio
    pin:
      number: ${button_four}
      mode:
        input: true
        pullup: true
    id: btnFour
    name: "Clock Button Four"
    internal: True
    on_press:
      then:
        - homeassistant.event:
            event: esphome.${device_name}.clock_button_pressed
            data: { button: "four", type: "single" }

sensor:
  - platform: adc
    id: ldr_light
    pin: ${ldr_pin}
    update_interval: 1s
    attenuation: 12db
    on_value_range:
      - below: 0.3
        then:
          - globals.set:
              id: brightness
              value: !lambda 'return (int) id(brightness_dark_cfg);'
          - logger.log:
              format: "Light Sensor Reports %.1f"
              args: [ 'id(ldr_light).state' ]

      - above: 0.3
        below: 0.8
        then:
          - globals.set:
              id: brightness
              value: !lambda 'return (int) id(brightness_dim_cfg);'
          - logger.log:
              format: "Light Sensor Reports %.1f"
              args: [ 'id(ldr_light).state' ]

      - above: 0.8
        below: 2.0
        then:
          - globals.set:
              id: brightness
              value: !lambda 'return (int) id(brightness_mid_cfg);'
          - logger.log:
              format: "Light Sensor Reports %.1f"
              args: [ 'id(ldr_light).state' ]

      - above: 2
        then:
          - globals.set:
              id: brightness
              value: !lambda 'return (int) id(brightness_bright_cfg);'
          - logger.log:
              format: "Light Sensor Reports %.1f"
              args: [ 'id(ldr_light).state' ]

  - platform: template
    name: "LDR Brightness Level"
    id: ldr_brightness_level
    unit_of_measurement: 'v'
    icon: "mdi:brightness-6"
    update_interval: 1s
    lambda: |-
      return (float) id(ldr_light).state;
      
media_player:
  - platform: speaker
    name: "Media Player"
    internal: False
    id: ${mediaplayer}
    announcement_pipeline:
        speaker: i2s_speaker
        format: WAV
    codec_support_enabled: false
    buffer_size: 6000
    volume_min: 0.4

    files:
      - id: timer_finished_wave_file
        file: https://github.com/esphome/wake-word-voice-assistants/raw/main/sounds/timer_finished.wav

    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - script.execute: stop_wake_word
    on_idle:
      - script.execute: start_wake_word

## VOICE ASSIST STUFF 
select:
  - platform: template
    entity_category: config
    name: Wake word engine location
    id: wake_word_engine_location
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    initial_option: On device
    on_value:
      - if:
          condition:
            lambda: return x == "In Home Assistant";
          then:
            - micro_wake_word.stop:
            - delay: 500ms
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:
      - if:
          condition:
            lambda: return x == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
            - delay: 500ms
            - micro_wake_word.start:
              
voice_assistant:
  id: va
  micro_wake_word:
  microphone:
    microphone: i2s_microphone
    channels: 0
    gain_factor: 4
  media_player: ${mediaplayer}
  noise_suppression_level: 2
  auto_gain: 31dBFS
  on_listening: 
    then:
        - lambda: |-
            id(page) = 3;
  on_idle: 
    then:
        - lambda: |-
            id(page) = 1;
  on_end:
    # Handle the "nevermind" case where there is no announcement
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    # Restart only mWW if enabled; streaming wake words automatically restart
    - if:
        condition:
          - lambda: |-
              return id(wake_word_engine_location).current_option() == "On device";
        then:
          - wait_until:
              - and:
                  - not:
                      voice_assistant.is_running:
          - lambda: id(va).set_use_wake_word(false);
          - micro_wake_word.start:
          - lambda: |-
              id(page) = 1;
  on_stt_vad_end: 
    then:
        - lambda: |-
            id(page) = 1;
  on_client_connected:
    - delay: 2s  # Give the api server time to settle
    - script.execute: start_wake_word
  on_client_disconnected:
    - script.execute: stop_wake_word
  on_timer_finished:
    - script.execute: stop_wake_word
    - wait_until:
        not:
          microphone.is_capturing:
script: 
  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: |-
                  return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: |-
                  return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:
  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: |-
                  return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: |-
              return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:

micro_wake_word:
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
  vad:
  models:
    - model: hey_jarvis

display:
  - id: !extend led_display
    lambda: |-
        static bool clock_should_blink = true;

        auto time_str = id(hass_time).now().strftime("%a");
        switch (id(page))
        {
        case 1:
          std::transform(time_str.begin(), time_str.end(), time_str.begin(), ::toupper);
          

          {
            int hour12 = id(hass_time).now().hour % 12 == 0 ? 12 : id(hass_time).now().hour % 12;
            char hour_str[3];
            sprintf(hour_str, "%d", hour12);
            int text_width, text_height, x_offset, y_offset;
            it.get_text_bounds(0, 0, hour_str, id(TimeFont), TextAlign::TOP_LEFT, &x_offset, &y_offset, &text_width, &text_height);
            it.print(23 - text_width, 0, id(TimeFont), hour_str);
          }

          it.strftime(25, 0, id(TimeFont), "%M", id(hass_time).now());
          it.print(0, 2, id(DayFont), time_str.c_str());
          it.line(0, 0, 13, 0);

          if (clock_should_blink) {
            it.print(23, 0, id(TimeFont), ":");
          }
          break;
          
        case 2:

          std::transform(time_str.begin(), time_str.end(), time_str.begin(), ::toupper);

          {
            int hour12 = id(hass_time).now().hour % 12 == 0 ? 12 : id(hass_time).now().hour % 12;
            char hour_str[3];
            sprintf(hour_str, "%d", hour12);
            int text_width, text_height, x_offset, y_offset;
            it.get_text_bounds(0, 0, hour_str, id(TimeFont), TextAlign::TOP_LEFT, &x_offset, &y_offset, &text_width, &text_height);
            it.print(23 - text_width, 0, id(TimeFont), hour_str);
          }

          it.strftime(25, 0, id(TimeFont), "%M", id(hass_time).now());

          if (clock_should_blink) {
            it.print(23, 0, id(TimeFont), ":");
          }

          it.printf(0, 0, id(DayFont), "%g°", id(outside_temp).state);
          it.line(0, 7, 9, 7);
          break;

          case 3:
            it.print(8, 0, id(DayFont), "Hello?");
            break;
        }

        clock_should_blink = !clock_should_blink;
        it.intensity(id(brightness));